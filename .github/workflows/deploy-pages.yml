name: Deploy course index to GitHub Pages

# Rebuild on every push so newly uploaded materials show up in the index.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The index only needs the file tree, so skip downloading the course files.
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            site
            scripts
            data

      - name: Build site
        run: python3 scripts/build_site.py --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
