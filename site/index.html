<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHU SBI 课程资料</title>
<meta name="description" content="安徽大学纽约石溪学院 DMT / AMS 课程资料索引">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e40af'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #fff; --fg: #111827; --muted: #6b7280; --faint: #9ca3af;
  --line: #e8eaee; --hover: #f5f6f8; --accent: #1e40af; --mark: #fde68a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1013; --fg: #e6e8eb; --muted: #9aa3ae; --faint: #69717c;
    --line: #22262d; --hover: #161a1f; --accent: #8ab4ff; --mark: #5c4a0c;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { max-width: 780px; margin: 0 auto; padding: 44px 20px 72px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: .01em; }
header a { color: var(--muted); font-size: 14px; text-decoration: none; white-space: nowrap; }
header a:hover { color: var(--accent); }
#stats { margin: 4px 0 22px; color: var(--muted); font-size: 13px; }

#q {
  width: 100%; height: 46px; padding: 0 16px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: inherit; font: inherit; outline: none;
}
#q::placeholder { color: var(--faint); }
#q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }

nav {
  display: flex; gap: 2px; margin: 16px 0 4px; border-bottom: 1px solid var(--line);
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  padding: 8px 12px; border: 0; background: none; color: var(--muted);
  font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
}
nav button:hover { color: var(--fg); }
nav button[aria-pressed="true"] { color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
nav small { margin-left: 4px; color: var(--faint); font-size: 12px; font-weight: 400; }

h2 { margin: 30px 0 2px; padding: 0 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
.hint { margin: 18px 8px 0; color: var(--muted); font-size: 13px; }

summary { list-style: none; cursor: pointer; }
summary::-webkit-details-marker { display: none; }

.row {
  display: grid; grid-template-columns: 72px 1fr auto 12px; gap: 12px; align-items: center;
  padding: 10px 8px; border-bottom: 1px solid var(--line);
}
.course > summary:hover { background: var(--hover); }
.course > summary::after {
  content: ""; justify-self: end; width: 6px; height: 6px; margin-right: 2px;
  border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint);
  transform: rotate(-45deg); transition: transform .15s;
}
.course[open] > summary::after { transform: rotate(45deg); }
.course[open] > summary { border-bottom-color: transparent; }
.code { color: var(--muted); font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.name { min-width: 0; }
.n { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.empty { color: var(--faint); }
.empty .code { color: var(--faint); }

.body { padding: 0 8px 14px 92px; border-bottom: 1px solid var(--line); font-size: 14px; }
.gh { display: inline-block; margin-bottom: 6px; color: var(--muted); font-size: 13px; text-decoration: none; }
.gh:hover { color: var(--accent); }
.dir > summary { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: var(--muted); }
.dir > summary::before {
  content: ""; flex: none; border: 4px solid transparent; border-left: 5px solid var(--faint);
  border-right-width: 0; transition: transform .15s;
}
.dir[open] > summary::before { transform: rotate(90deg); }
.dir > summary:hover { color: var(--fg); }
.kids { margin-left: 2px; padding-left: 14px; border-left: 1px solid var(--line); }
.file { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; }
.file > a:first-child { min-width: 0; text-decoration: none; overflow-wrap: anywhere; }
.file > a:first-child:hover { color: var(--accent); text-decoration: underline; }
.path { color: var(--faint); }
.dl { flex: none; margin-left: auto; padding: 0 4px; color: var(--faint); text-decoration: none; }
.dl:hover { color: var(--accent); }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

.more > summary { padding: 16px 8px 8px; color: var(--muted); font-size: 13px; }
.more > summary:hover { color: var(--fg); }

footer { margin-top: 48px; color: var(--faint); font-size: 12px; }
footer a { color: var(--muted); }

@media (max-width: 560px) {
  .wrap { padding-top: 28px; }
  nav small { display: none; }
  .row { grid-template-columns: 62px 1fr auto 10px; gap: 10px; }
  .body { padding-left: 8px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AHU SBI 课程资料</h1>
    <a id="repo" href="https://github.com/UponNoise/AHU_SBI">GitHub ↗</a>
  </header>
  <p id="stats"></p>
  <input id="q" type="search" placeholder="搜索课程、课号或文件名" autocomplete="off" spellcheck="false" aria-label="搜索">
  <nav id="tabs"></nav>
  <main id="list"></main>
  <footer>资料仅供个人学习交流 · <a id="contrib" href="https://github.com/UponNoise/AHU_SBI/blob/main/CONTRIBUTING.md">贡献资料</a></footer>
</div>
<script src="data.js"></script>
<script>
(() => {
  const S = window.SITE;
  const list = document.getElementById('list');
  const input = document.getElementById('q');
  const tabs = document.getElementById('tabs');
  const collator = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
  const MAX_HITS = 50;

  const courses = Object.entries(S.courses).map(([slug, c]) => ({
    slug, ...c,
    label: `${c.code} ${c.name}`.toLowerCase(),
    haystack: c.files.map(f => `${c.code} ${c.name} ${f}`.toLowerCase()),
  }));
  const bySlug = new Map(courses.map(c => [c.slug, c]));
  const byCode = (a, b) => (!a.code - !b.code) || collator.compare(a.code, b.code) || collator.compare(a.name, b.name);

  const esc = s => s.replace(/[&<>"']/g, ch => `&#${ch.charCodeAt(0)};`);
  const url = (kind, path) =>
    `https://github.com/${S.repo}/${kind}/${S.branch}/${path.split('/').map(encodeURIComponent).join('/')}`;
  const coursePath = (c, rel) => rel ? `${S.root}/${c.slug}/${rel}` : `${S.root}/${c.slug}`;
  const typeRank = name => { const i = S.types.indexOf(name); return i < 0 ? S.types.length : i; };

  document.getElementById('repo').href = `https://github.com/${S.repo}`;
  document.getElementById('contrib').href = url('blob', 'CONTRIBUTING.md');

  const withFiles = courses.filter(c => c.files.length);
  const fileTotal = withFiles.reduce((n, c) => n + c.files.length, 0);
  document.getElementById('stats').textContent =
    `${withFiles.length} 门课程 · ${fileTotal.toLocaleString('zh-CN')} 个文件 · 更新于 ${S.updated}`;

  // ---- tabs ----
  const TABS = [{ id: '', name: '全部' }, ...S.majors.map(m => ({ id: m.id, name: m.name, sub: m.id }))];
  tabs.innerHTML = TABS.map(t =>
    `<button type="button" data-tab="${esc(t.id)}">${esc(t.name)}${t.sub ? `<small>${esc(t.sub)}</small>` : ''}</button>`
  ).join('');
  const currentTab = () => {
    const id = decodeURIComponent(location.hash.slice(1));
    return TABS.some(t => t.id === id) ? id : '';
  };
  tabs.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    history.replaceState(null, '', b.dataset.tab ? `#${b.dataset.tab}` : location.pathname + location.search);
    render();
  });
  window.addEventListener('hashchange', render);

  const pool = tab => {
    if (!tab) return courses;
    const slugs = new Set(S.majors.find(m => m.id === tab).groups.flatMap(g => g.courses));
    return courses.filter(c => slugs.has(c.slug));
  };

  // ---- rows ----
  function row(c, hits) {
    const code = `<span class="code">${esc(c.code)}</span>`;
    if (!c.files.length) {
      return `<div class="row empty">${code}<span class="name">${esc(c.name)}</span><span class="n">暂无</span><span></span></div>`;
    }
    const name = hits ? highlight(c.name, hits.terms) : esc(c.name);
    const count = hits ? `${hits.files.length} / ${c.files.length}` : c.files.length;
    const body = hits ? hitList(c, hits) : '';
    return `<details class="course" data-slug="${esc(c.slug)}"${hits ? ' open' : ''}>` +
      `<summary class="row">${code}<span class="name">${name}</span><span class="n">${count}</span></summary>` +
      `<div class="body">${body}</div></details>`;
  }

  function fileRow(c, rel, labelHtml) {
    const path = coursePath(c, rel);
    return `<div class="file"><a href="${url('blob', path)}" target="_blank" rel="noopener">${labelHtml}</a>` +
      `<a class="dl" href="${url('raw', path)}" title="下载" aria-label="下载">↓</a></div>`;
  }

  const ghLink = c => `<a class="gh" href="${url('tree', coursePath(c))}" target="_blank" rel="noopener">在 GitHub 中打开 ↗</a>`;

  function tree(files) {
    const root = { dirs: new Map(), files: [], count: 0 };
    for (const f of files) {
      const parts = f.split('/');
      let node = root;
      root.count++;
      for (const part of parts.slice(0, -1)) {
        if (!node.dirs.has(part)) node.dirs.set(part, { dirs: new Map(), files: [], count: 0 });
        node = node.dirs.get(part);
        node.count++;
      }
      node.files.push(f);
    }
    return root;
  }

  function renderTree(c, node, depth) {
    const names = [...node.dirs.keys()].sort((a, b) =>
      (depth === 0 ? typeRank(a) - typeRank(b) : 0) || collator.compare(a, b));
    let html = '';
    for (const name of names) {
      const d = node.dirs.get(name);
      const open = d.count <= 20 || (depth === 0 && d.dirs.size + d.files.length <= 20);
      html += `<details class="dir"${open ? ' open' : ''}><summary>${esc(name)}<span class="n">${d.count}</span></summary>` +
        `<div class="kids">${renderTree(c, d, depth + 1)}</div></details>`;
    }
    for (const f of node.files.sort(collator.compare)) html += fileRow(c, f, esc(f.slice(f.lastIndexOf('/') + 1)));
    return html;
  }

  function hitList(c, hits) {
    let html = '';
    for (const f of hits.files.slice(0, MAX_HITS)) {
      const cut = f.lastIndexOf('/') + 1;
      html += fileRow(c, f, `<span class="path">${esc(f.slice(0, cut))}</span>${highlight(f.slice(cut), hits.terms)}`);
    }
    if (hits.files.length > MAX_HITS) html += `<p class="hint">另有 ${hits.files.length - MAX_HITS} 个匹配文件，可继续输入关键词缩小范围</p>`;
    return html;
  }

  // Lazily fill a course body the first time it is expanded.
  list.addEventListener('toggle', e => {
    const el = e.target;
    if (!el.classList.contains('course') || !el.open) return;
    const body = el.querySelector('.body');
    if (body.childElementCount) return;
    const c = bySlug.get(el.dataset.slug);
    body.innerHTML = ghLink(c) + renderTree(c, tree(c.files), 0);
  }, true);

  function highlight(text, terms) {
    const lower = text.toLowerCase();
    const marks = new Array(text.length).fill(false);
    for (const t of terms) {
      for (let i = lower.indexOf(t); i >= 0; i = lower.indexOf(t, i + 1)) marks.fill(true, i, i + t.length);
    }
    let html = '';
    for (let i = 0; i < text.length;) {
      let j = i;
      while (j < text.length && marks[j] === marks[i]) j++;
      html += marks[i] ? `<mark>${esc(text.slice(i, j))}</mark>` : esc(text.slice(i, j));
      i = j;
    }
    return html;
  }

  // ---- views ----
  function browse(tab) {
    if (!tab) {
      const full = withFiles.slice().sort(byCode).map(c => row(c)).join('');
      const empty = courses.filter(c => !c.files.length).sort(byCode);
      return full + (empty.length
        ? `<details class="more"><summary>暂无资料的课程（${empty.length}）</summary>${empty.map(c => row(c)).join('')}</details>`
        : '');
    }
    return S.majors.find(m => m.id === tab).groups.map(g =>
      `<h2>${esc(g.name)}</h2>` + g.courses.map(slug => row(bySlug.get(slug))).join('')
    ).join('');
  }

  function search(tab, terms) {
    const byName = [], byFile = [];
    let fileHits = 0;
    for (const c of pool(tab)) {
      if (terms.every(t => c.label.includes(t))) { byName.push(c); continue; }
      const files = c.files.filter((_, i) => terms.every(t => c.haystack[i].includes(t)));
      if (files.length) { byFile.push({ c, files }); fileHits += files.length; }
    }
    if (!byName.length && !byFile.length) return `<p class="hint">没有找到匹配的课程或文件</p>`;
    byName.sort((a, b) => (!a.files.length - !b.files.length) || byCode(a, b));
    byFile.sort((a, b) => byCode(a.c, b.c));
    const summary = [byName.length && `${byName.length} 门课程`, fileHits && `${fileHits} 个文件`].filter(Boolean).join(' · ');
    return `<p class="hint">${summary}</p>` +
      byName.map(c => row(c)).join('') +
      byFile.map(({ c, files }) => row(c, { files, terms })).join('');
  }

  function render() {
    const tab = currentTab();
    for (const b of tabs.children) b.setAttribute('aria-pressed', String(b.dataset.tab === tab));
    const terms = input.value.toLowerCase().split(/\s+/).filter(Boolean);
    list.innerHTML = terms.length ? search(tab, terms) : browse(tab);
  }

  input.addEventListener('input', render);
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape' && input.value) { input.value = ''; render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== input && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      input.focus();
    }
  });

  render();
})();
</script>
</body>
</html>
